<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Electricidad - Índice</title>
    <style>
        :root {
            /* Nueva paleta de azules profesionales */
            --azul-claro: #e3f2fd;
            --azul-medio: #2196f3;
            --azul-oscuro: #0d47a1;
            --azul-acento: #03a9f4;
            --gris-suave: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor-indice {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--azul-claro);
        }

        h1 {
            color: var(--azul-oscuro);
            margin-bottom: 10px;
        }

        .menu-opciones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .opcion-card {
            text-decoration: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }

        .opcion-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(13, 71, 161, 0.15);
        }


        .btn-leyes {
            background-color: var(--azul-medio);
            color: white;
            border-color: var(--azul-oscuro);
        }

        .btn-leyes:hover {
            background-color: var(--azul-oscuro);
        }

        .btn-taller {
            background-color: var(--azul-claro);
            color: var(--azul-oscuro);
            border-color: var(--azul-medio);
        }

        .btn-taller:hover {
            background-color: #bbdefb;
        }

        .btn-externo {
            background-color: var(--gris-suave);
            color: #555;
            border-color: #ccc;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .btn-externo:hover {
            background-color: #e0e0e0;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #90a4ae;
        }
    </style>
</head>
<body>

    <div class="contenedor-indice">
        <h1>ツ Mi Portafolio ツ </h1>
        <p>Explora las secciones de electricidad y electrónica:</p>

        <div class="menu-opciones">
            <a href="leyes.html" class="opcion-card btn-leyes">
                1. Leyes Fundamentales
            </a>

            <a href="taller.html" class="opcion-card btn-taller">
                2. Taller de Investigación
            </a>

            <a href="electronica.html" class="opcion-card btn-electronica">
                3. Electronica Basica
            </a>

            <hr style="width: 80%; border: 0.5px solid #eee; margin: 10px auto;">

            <a href="https://jarudev.github.io/itcts4z/" class="opcion-card btn-externo">
                Ir a Página Principal (ITCTS4Z)
            </a>

        </div>

        <footer>
            Sebas Jimenez &copy; 2026
        </footer>
    </div>

</body>
</html>
